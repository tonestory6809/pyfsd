[build-system]
requires = ["pdm-backend", "versioneer[toml]>=0.29" ]
build-backend = "pdm.backend"

[project]
name = "pyfsd"
description = "An implementation of protocol 9 of FSD based on Python."
authors = [{name = "tonestory6809", email = "175278158+tonestory6809@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = []
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "haversine~=2.9",
    "tomli~=2.4; python_version < \"3.11\"",
    "metar~=1.11",
    "sqlalchemy[asyncio]~=2.0",
    "aiohttp~=3.13",
    "typing-extensions~=4.15",
    "argon2-cffi~=25.1",
    "dependency-injector~=4.48",
    "structlog~=25.5",
    "colorama~=0.4; sys_platform == \"win32\"",
    "better-exceptions~=0.3",
    "uvloop~=0.22; sys_platform != \"win32\"",
]

[project.urls]
Homepage = "https://github.com/tonestory6809/pyfsd"
Documentation = "https://tonestory6809.github.io/pyfsd"
Repository = "https://github.com/tonestory6809/pyfsd"
Issues = "https://github.com/tonestory6809/pyfsd/issues"
Discussions = "https://github.com/tonestory6809/pyfsd/discussions"

[project.optional-dependencies]
sqlite3 = [
    "aiosqlite~=0.22",
]
postgresql = [
    "asyncpg~=0.31",
]
mysql = [
    "asyncmy~=0.2",
]
oracle = [
    "oracledb~=3.4",
]
mssql = [
    "aioodbc~=0.5",
]

[tool.pdm.build]
package-dir = "src"
includes = ["src/pyfsd", "src/pyfsd/plugins/__init__.py"]
excludes = ["src/pyfsd/plugins/*", "**/.mypy_cache"]

[tool.pdm.scripts]
start = "python -m pyfsd"

[tool.pdm.version]
source = "call"
getter = "versioneer:get_version"
write_to = "pyfsd/_version.py"
write_template = "version = \"{}\"\n"

[tool.pyright]
exclude = [
    "**/__pycache__",
    "__pypackages__",
    ".venv",
    ".git",
]

[tool.ruff]
target-version = "py310"

